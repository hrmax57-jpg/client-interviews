<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クライアントインタビュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F5F7;
  --surface:#FFFFFF;
  --surface-2:#E9EDF1;
  --ink:#13202B;
  --ink-2:#55656F;
  --ink-3:#8B9AA4;
  --line:#D6DDE3;
  --accent:#1F5F8B;
  --accent-soft:#E3EEF6;
  --video-bg:#0B1116;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161D;
    --surface:#16222B;
    --surface-2:#1D2B36;
    --ink:#E9EEF2;
    --ink-2:#A9B6BF;
    --ink-3:#71818C;
    --line:#26343E;
    --accent:#79B6E0;
    --accent-soft:#1B3140;
    --video-bg:#060A0D;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161D;
  --surface:#16222B;
  --surface-2:#1D2B36;
  --ink:#E9EEF2;
  --ink-2:#A9B6BF;
  --ink-3:#71818C;
  --line:#26343E;
  --accent:#79B6E0;
  --accent-soft:#1B3140;
  --video-bg:#060A0D;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans JP",-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  font-size:15px;
  line-height:1.9;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px;margin:0 auto;padding:48px 24px 80px}
header{
  display:flex;flex-direction:column;gap:12px;
  padding-bottom:28px;margin-bottom:32px;
  border-bottom:1px solid var(--line);
}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--accent);font-weight:500}
h1{
  margin:0;
  font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  font-weight:600;font-size:clamp(28px,4.5vw,38px);line-height:1.35;
  letter-spacing:.02em;text-wrap:balance;
}
.lead{margin:0;max-width:34em;color:var(--ink-2)}

/* プレーヤー */
.player{
  display:flex;flex-direction:column;gap:14px;
}
.stage{
  position:relative;width:100%;aspect-ratio:16/9;
  background:var(--video-bg);border-radius:8px;overflow:hidden;
}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.stage.portrait iframe{left:50%;transform:translateX(-50%);width:auto;aspect-ratio:9/16;height:100%}
/* 自前のポスター：YouTube側の題名・ロゴ・「YouTubeで見る」を一切見せない */
.poster{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;
  opacity:1;filter:none;transition:opacity .35s ease,filter .35s ease;
}
.stage.playing .poster{opacity:0}
.stage.paused .poster,.stage.ended .poster{opacity:1;filter:brightness(.42)}
/* 再生直後の数秒だけ上下に帯を出し、YouTubeの題名・ロゴが消えるまで隠す */
.veil{position:absolute;inset:0;z-index:1;pointer-events:none}
.veil .bar{position:absolute;left:0;right:0;height:19%;background:var(--video-bg);opacity:0;transition:opacity .6s ease}
.veil .bar.top{top:0}
.veil .bar.bottom{bottom:0}
.stage.veil-on .veil .bar{opacity:1;transition:none}
/* 透明の盾：クリックはすべてこちらで受ける */
.shield{
  position:absolute;inset:0;z-index:2;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:transparent;border:0;padding:0;color:#fff;
}
.shield:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.shield .big{
  width:76px;height:76px;border-radius:50%;
  background:rgba(12,18,24,.78);color:#fff;
  display:grid;place-items:center;font-size:28px;padding-left:4px;
  transition:opacity .2s ease,transform .2s ease;
  box-shadow:0 2px 14px rgba(0,0,0,.4);
}
.shield .hint{font-size:13px;letter-spacing:.08em;text-shadow:0 1px 6px rgba(0,0,0,.6);transition:opacity .2s ease}
.stage.playing .shield .big,.stage.playing .shield .hint{opacity:0;transform:scale(.85)}
.stage.playing:hover .shield .big{opacity:.4;transform:scale(.9)}
.box{display:flex;flex-direction:column;gap:10px}
.box:fullscreen{background:#000;gap:0;width:100%;height:100%}
.box:fullscreen .stage{flex:1;min-height:0;aspect-ratio:auto;border-radius:0}
.box:fullscreen .stage.portrait iframe{width:auto;height:100%}
.box:fullscreen .ctrl{border:0;border-radius:0;background:#0B1116;padding:10px 16px 14px;
  --ink:#fff;--ink-2:#d6dde3;--ink-3:#9aa8b2;--surface:#0B1116;--line:rgba(255,255,255,.3);--accent:#fff;--accent-soft:rgba(255,255,255,.16)}

/* 操作パネル（自前） */
.ctrl{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:center;
  padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;
}
.ctrl .row2{grid-column:1 / -1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctrl button{
  all:unset;cursor:pointer;display:inline-grid;place-items:center;
  min-width:36px;height:36px;padding:0 10px;border-radius:6px;
  color:var(--ink);font:inherit;font-size:14px;line-height:1;
}
.ctrl button:hover{background:var(--accent-soft)}
.ctrl button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ctrl .time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2);white-space:nowrap;min-width:6.5em;text-align:right}
.seek{
  -webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0;cursor:pointer;
}
.seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(var(--accent),var(--accent)) 0/var(--p,0%) 100% no-repeat,var(--line)}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);margin-top:-5px}
.seek::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
.seek::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
.seek::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--accent)}
.seek:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.speed{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.speed .lbl{font-size:11px;letter-spacing:.14em;color:var(--ink-3);margin-right:4px}
.speed button{min-width:44px;height:30px;padding:0 8px;font-size:13px;font-variant-numeric:tabular-nums;border:1px solid var(--line)}
.speed button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.box:fullscreen .speed button[aria-pressed="true"]{background:#fff;color:#111}
.ctrl .spacer{flex:1}
.ctrl .vol{display:flex;align-items:center;gap:4px}
.ctrl button svg{display:block}
#btn-mute.muted .w1,#btn-mute.muted .w2{display:none}
#btn-mute.muted .mx{display:inline !important}
.ctrl input[type=range].volr{width:80px;-webkit-appearance:none;appearance:none;height:20px;background:transparent}
.ctrl input[type=range].volr::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--line)}
.ctrl input[type=range].volr::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ink-2);margin-top:-4.5px}
.ctrl input[type=range].volr::-moz-range-track{height:3px;border-radius:2px;background:var(--line)}
.ctrl input[type=range].volr::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--ink-2)}
@media (max-width:640px){
  .ctrl{grid-template-columns:auto 1fr auto}
  .ctrl .time{min-width:0}
}
.now{display:flex;flex-direction:column;gap:2px;min-height:64px}
.now .tag{font-size:12px;letter-spacing:.14em;color:var(--ink-3)}
.now .name{
  margin:0;
  font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  font-weight:600;font-size:22px;line-height:1.4;letter-spacing:.02em;
}
.now .note{margin:0;color:var(--ink-2);font-size:14px}

/* 一覧 */
.list-head{
  margin:44px 0 14px;font-size:12px;letter-spacing:.18em;color:var(--ink-3);font-weight:500;
}
.list{
  list-style:none;margin:0;padding:0;
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;
}
.list button{
  all:unset;display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;
  width:100%;padding:12px;border-radius:8px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);
  color:var(--ink);font:inherit;line-height:1.5;
  transition:background .15s ease,border-color .15s ease;
}
.list button:hover{border-color:var(--accent)}
.list button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list button[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.thumb{
  position:relative;width:96px;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:var(--video-bg);
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{
  position:absolute;inset:0;display:grid;place-items:center;color:#fff;
  background:rgba(0,0,0,.18);opacity:0;transition:opacity .15s ease;
}
.list button:hover .play,.list button[aria-current="true"] .play{opacity:1}
.list button[aria-current="true"] .play::after{content:"再生中";font-size:11px;letter-spacing:.1em}
.list button:not([aria-current="true"]) .play::after{content:"▶";font-size:16px}
.txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.txt .kind{font-size:11px;letter-spacing:.14em;color:var(--ink-3)}
.txt .ttl{
  font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  font-weight:600;font-size:16px;letter-spacing:.02em;
}
.txt .sub{font-size:13px;color:var(--ink-2)}

@media (max-width:640px){
  .wrap{padding:36px 16px 64px}
  .list{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){
  .stage,.list button,.thumb .play{transition:none}
}
footer{
  margin-top:64px;padding-top:24px;border-top:1px solid var(--line);
  color:var(--ink-3);font-size:12px;letter-spacing:.04em;
}
</style>
</head>

      </div>
    </div>
    </div>
    <div class="now" aria-live="polite">
      <span class="tag" id="now-tag">INTERVIEW 1</span>
      <h2 class="name" id="now-name">世界水球 銀メダリスト</h2>
      <p class="note" id="now-note"></p>
    </div>

<script>
(function(){
  var stage = document.getElementById('stage');
  var shield = document.getElementById('shield');
  var bigicon = document.getElementById('bigicon');
  var hint = document.getElementById('hint');
  var poster = document.getElementById('poster');
  var ctrl = document.getElementById('ctrl');
  var btnPlay = document.getElementById('btn-play');
  var seek = document.getElementById('seek');
  var timeEl = document.getElementById('time');
  var btnMute = document.getElementById('btn-mute');
  var vol = document.getElementById('vol');
  var btnFs = document.getElementById('btn-fs');
  var speedBtns = document.querySelectorAll('.speed button');
  var nowTag = document.getElementById('now-tag');
  var nowName = document.getElementById('now-name');
  var nowNote = document.getElementById('now-note');
  var buttons = document.querySelectorAll('#list button');

  var player = null, ready = false, pending = null, timer = null, seeking = false, rate = 1;

  function fmt(s){
    s = Math.max(0, Math.floor(s || 0));
    var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
    var mm = (h ? String(m).padStart(2,'0') : m) + ':' + String(sec).padStart(2,'0');
    return h ? h + ':' + mm : mm;
  }

  function current(){ return document.querySelector('#list button[aria-current="true"]'); }

  function select(btn){
    stage.classList.toggle('portrait', btn.getAttribute('data-portrait') === '1');
    poster.src = 'posters/' + btn.getAttribute('data-id') + '.jpg';
    stage.classList.remove('playing','paused','ended','veil-on');
    bigicon.textContent = '▶'; hint.textContent = '';
    nowTag.textContent = btn.getAttribute('data-tag');
    nowName.textContent = btn.getAttribute('data-name');
    nowNote.textContent = btn.getAttribute('data-note') || '';
    buttons.forEach(function(b){ b.removeAttribute('aria-current'); });
    btn.setAttribute('aria-current','true');
    if (history.replaceState) history.replaceState(null, '', '#' + btn.getAttribute('data-slug'));
  }

  function play(btn, opts){
    opts = opts || {};
    select(btn);
    var id = btn.getAttribute('data-id');
    if (ready) {
      if (opts.autoplay) player.loadVideoById(id); else player.cueVideoById(id);
      player.setPlaybackRate(rate);
    } else {
      pending = {id: id, autoplay: !!opts.autoplay};
    }
    if (opts.scroll !== false) {
      var top = stage.getBoundingClientRect().top + window.pageYOffset - 16;
      window.scrollTo({top: top, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
    }
  }

  buttons.forEach(function(b){
    b.addEventListener('click', function(){ play(b, {autoplay: true}); });
  });

  // URLの #suikyu / #kitaoka / #suga / #short で、そのインタビューを開いた状態で表示
  function openFromHash(){
    var slug = (location.hash || '').replace('#', '');
    var target = slug && document.querySelector('#list button[data-slug="' + slug + '"]');
    return target || null;
  }
  var first = openFromHash() || buttons[0];
  select(first);
  window.addEventListener('hashchange', function(){
    var t = openFromHash();
    if (t && t.getAttribute('aria-current') !== 'true') play(t, {autoplay:false, scroll:false});
  });

  // ---- YouTube IFrame API ----
  window.onYouTubeIframeAPIReady = function(){
    player = new YT.Player('yt', {
      videoId: first.getAttribute('data-id'),
      playerVars: {rel:0, modestbranding:1, playsinline:1, controls:0, disablekb:1, fs:0, iv_load_policy:3, origin: location.origin},
      events: {
        onReady: function(){
          ready = true;
          ctrl.hidden = false;
          if (pending) { play(current(), {autoplay: pending.autoplay, scroll:false}); pending = null; }
          tick();
        },
        onStateChange: function(e){
          var S = YT.PlayerState;
          if (e.data === S.BUFFERING) return;
          var playing = e.data === S.PLAYING;
          stage.classList.toggle('playing', playing);
          stage.classList.toggle('paused', e.data === S.PAUSED);
          stage.classList.toggle('ended', e.data === S.ENDED);
          if (playing && lastState !== S.PLAYING) veil();
          lastState = e.data;
          btnPlay.textContent = playing ? '❚❚' : '▶';
          btnPlay.setAttribute('aria-label', playing ? '一時停止' : '再生');
          bigicon.textContent = e.data === S.ENDED ? '↻' : (playing ? '❚❚' : '▶');
          hint.textContent = e.data === S.PAUSED ? '続きを見る' : (e.data === S.ENDED ? 'もう一度見る' : '');
          if (playing) { player.setPlaybackRate(rate); startTimer(); } else { stopTimer(); tick(); }
        }
      }
    });
  };
  var lastState = -1, veilTimer = null;
  function veil(){
    stage.classList.add('veil-on');
    if (veilTimer) clearTimeout(veilTimer);
    veilTimer = setTimeout(function(){ stage.classList.remove('veil-on'); }, 3800);
  }
  var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);

  function startTimer(){ stopTimer(); timer = setInterval(tick, 250); }
  function stopTimer(){ if (timer) clearInterval(timer); timer = null; }
  function tick(){
    if (!ready) return;
    var d = player.getDuration() || 0, t = player.getCurrentTime() || 0;
    if (!seeking && d) { seek.value = Math.round(t / d * 1000); seek.style.setProperty('--p', (t/d*100) + '%'); }
    timeEl.textContent = fmt(t) + ' / ' + fmt(d);
  }

  function toggle(){
    if (!ready) return;
    var st = player.getPlayerState();
    if (st === YT.PlayerState.PLAYING) player.pauseVideo();
    else if (st === YT.PlayerState.ENDED) { player.seekTo(0, true); player.playVideo(); }
    else player.playVideo();
  }
  shield.addEventListener('click', toggle);
  btnPlay.addEventListener('click', toggle);

  seek.addEventListener('input', function(){
    seeking = true;
    var d = player && ready ? player.getDuration() : 0;
    seek.style.setProperty('--p', (seek.value/10) + '%');
    timeEl.textContent = fmt(d * seek.value / 1000) + ' / ' + fmt(d);
  });
  seek.addEventListener('change', function(){
    if (ready) player.seekTo(player.getDuration() * seek.value / 1000, true);
    seeking = false;
  });

  speedBtns.forEach(function(b){
    b.addEventListener('click', function(){
      rate = parseFloat(b.getAttribute('data-rate'));
      speedBtns.forEach(function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      if (ready) player.setPlaybackRate(rate);
    });
  });

  function setMuteIcon(muted){
    btnMute.classList.toggle('muted', muted);
    btnMute.setAttribute('aria-label', muted ? '消音を解除' : '消音');
  }
  btnMute.addEventListener('click', function(){
    if (!ready) return;
    if (player.isMuted()) { player.unMute(); setMuteIcon(false); }
    else { player.mute(); setMuteIcon(true); }
  });
  vol.addEventListener('input', function(){
    if (!ready) return;
    player.setVolume(parseInt(vol.value, 10));
    if (parseInt(vol.value,10) > 0 && player.isMuted()) { player.unMute(); }
    setMuteIcon(parseInt(vol.value,10) === 0);
  });

  btnFs.addEventListener('click', function(){
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    var el = document.getElementById('box');
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  });

  // キーボード：スペース=再生/停止、←→=10秒
  document.addEventListener('keydown', function(e){
    if (!ready) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { player.seekTo(player.getCurrentTime() + 10, true); }
    else if (e.key === 'ArrowLeft') { player.seekTo(Math.max(0, player.getCurrentTime() - 10), true); }
  });
})();
</script>
</body>
</html>
